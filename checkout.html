<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#155eef">
  <title>Checkout | Cash Deliver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #155eef;
      --dark: #0b3180;
      --orange: #ffab36;
      --text: #172033;
      --muted: #697386;
      --bg: #f6f8fd;
      --border: #e7ebf3;
      --green: #16834a;
      --red: #b42318;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    input, select, textarea, button { font: inherit; }
    .container { width: min(1150px, calc(100% - 32px)); margin: auto; }

    .announcement { background: var(--dark); color: white; text-align: center; padding: 9px; font-size: 11px; }
    .announcement strong { color: #ffd18b; }
    header { background: white; box-shadow: 0 2px 12px #102d5c0c; }
    .header-main { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--blue); color: white; font-size: 24px; }
    .brand-name { font-size: 22px; font-weight: 800; letter-spacing: -1px; }
    .brand-name span { color: var(--blue); }
    .tagline { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .header-links { display: flex; align-items: center; gap: 20px; font-size: 12px; font-weight: 700; }
    .header-links a:hover { color: var(--blue); }

    .breadcrumb { padding: 22px 0 12px; color: var(--muted); font-size: 12px; }
    .breadcrumb a { color: var(--blue); }
    .page-heading { margin: 8px 0 25px; }
    .page-heading h1 { margin: 0; font-size: clamp(27px, 4vw, 36px); letter-spacing: -1px; }
    .page-heading p { color: var(--muted); font-size: 13px; margin: 7px 0 0; }

    .checkout-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; gap: 22px; padding-bottom: 55px; }
    .checkout-panel, .summary-panel { background: white; border: 1px solid var(--border); border-radius: 17px; }
    .form-section { padding: 22px; border-bottom: 1px solid var(--border); }
    .form-section:last-child { border-bottom: 0; }
    .section-title { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .section-number { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 11px; background: #edf3ff; color: var(--blue); font-size: 13px; font-weight: 800; }
    .section-title h2 { margin: 0; font-size: 16px; }
    .section-title p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; font-weight: 700; }
    .field label span { color: var(--red); }
    .field input, .field select, .field textarea {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #dce4f2;
      border-radius: 10px;
      outline: none;
      background: white;
      color: var(--text);
      font-size: 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #155eef16; }
    .field textarea { min-height: 90px; resize: vertical; }
    .field small { color: var(--muted); font-size: 10px; }

    .area-info { padding: 13px; margin-bottom: 16px; border-radius: 11px; background: #edf3ff; color: #284777; font-size: 11px; line-height: 1.7; }
    .cod-card { display: flex; gap: 13px; align-items: flex-start; padding: 16px; border: 1px solid #b9e4c7; border-radius: 12px; background: #f0fbf3; }
    .cod-icon { font-size: 28px; }
    .cod-card h3 { margin: 0 0 5px; color: #166534; font-size: 14px; }
    .cod-card p { margin: 0; color: #42664c; font-size: 11px; line-height: 1.6; }
    .cod-label { display: inline-block; margin-top: 9px; padding: 5px 8px; border-radius: 6px; background: #d9f5e2; color: #166534; font-size: 10px; font-weight: 800; }

    .summary-panel { position: sticky; top: 18px; padding: 20px; }
    .summary-panel h2 { margin: 0 0 15px; font-size: 17px; }
    .summary-items { display: grid; gap: 12px; max-height: 280px; overflow: auto; }
    .summary-item { display: grid; grid-template-columns: 43px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
    .summary-item-emoji { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 10px; background: #eef3ff; font-size: 21px; }
    .summary-item-name { font-size: 11px; font-weight: 700; line-height: 1.45; }
    .summary-item-meta { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .summary-item-price { font-size: 11px; font-weight: 800; white-space: nowrap; }
    .summary-row { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0; color: #536076; font-size: 12px; }
    .summary-row strong { color: var(--text); text-align: right; }
    .summary-row.total { padding-top: 14px; border-top: 1px solid var(--border); color: var(--text); font-size: 14px; font-weight: 800; }
    .summary-row.total strong { color: var(--blue); font-size: 20px; }
    .notice { padding: 12px; margin: 15px 0; border-radius: 10px; background: #fff4e4; color: #76501d; font-size: 10px; line-height: 1.7; }
    .terms { display: flex; align-items: flex-start; gap: 9px; margin: 16px 0 0; font-size: 10px; }
